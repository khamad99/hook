server {
    server_name hook.almaidana.ae hook.ezeebooks.tech;

    root /var/www/hook;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fix for double /api prefix
    location /api/api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header X-Frappe-Site-Name erp.almaidana.ae;
        proxy_set_header Host erp.almaidana.ae;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FIX: Handle private files by stripping /api prefix and forwarding to /private/files
    location /api/private/files/ {
        proxy_pass http://127.0.0.1:8000/private/files/;
        proxy_set_header X-Frappe-Site-Name erp.almaidana.ae;
        proxy_set_header Host erp.almaidana.ae;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header X-Frappe-Site-Name erp.almaidana.ae;
        proxy_set_header Host erp.almaidana.ae;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/hook.almaidana.ae/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/hook.almaidana.ae/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = hook.almaidana.ae) {
        return 301 https://$host$request_uri;
    }
    if ($host = hook.ezeebooks.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name hook.almaidana.ae hook.ezeebooks.tech;
    return 404; # managed by Certbot


}
